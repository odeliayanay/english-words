<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מחברת המילים שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a school notebook page — ruled lines, red margin on the right (RTL), one tool per tab */
:root{
  --paper:#F4F7FB; --sheet:#FFFFFF; --rule:#DCE6F2; --margin:#E25B5F;
  --ink:#1D3478; --ink-soft:#5B6B8F; --hl:#FFE35A; --ok:#2B9A66; --ok-bg:#E3F5EC;
  --bad:#D2454B; --bad-bg:#FCE9EA; --line:#CBD6E6; --chip:#EAF0FA;
  --display:"Fredoka","Assistant",system-ui,sans-serif;
  --body:"Assistant","Fredoka",system-ui,sans-serif;
  --shadow:0 2px 0 rgba(29,52,120,.08),0 8px 24px rgba(29,52,120,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10172A; --sheet:#18223A; --rule:#243152; --margin:#F07378;
  --ink:#DCE5FF; --ink-soft:#97A6CC; --hl:#8A7418; --ok:#5BD49B; --ok-bg:#15392B;
  --bad:#FF7F85; --bad-bg:#3E1C22; --line:#2E3C60; --chip:#223056;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10172A; --sheet:#18223A; --rule:#243152; --margin:#F07378;
  --ink:#DCE5FF; --ink-soft:#97A6CC; --hl:#8A7418; --ok:#5BD49B; --ok-bg:#15392B;
  --bad:#FF7F85; --bad-bg:#3E1C22; --line:#2E3C60; --chip:#223056;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-block:20px 48px;padding-inline:16px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,40px);margin:0;line-height:1.1;text-wrap:balance}
h1 .mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 4px}
.sub{color:var(--ink-soft);margin:4px 0 0}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500}
.bar{width:140px;height:12px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.num{font-variant-numeric:tabular-nums}

nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:600 16px var(--display);color:var(--ink);background:var(--sheet);border:2px solid var(--line);
  border-radius:12px;padding:8px 14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

.page{background:var(--sheet);border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  padding:24px 44px 28px 20px;
  background-image:linear-gradient(var(--sheet),var(--sheet)),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
  background-blend-mode:normal;}
.page{background:repeating-linear-gradient(to bottom,var(--sheet) 0 31px,var(--rule) 31px 32px)}
.page::before{content:"";position:absolute;top:0;bottom:0;right:28px;width:2px;background:var(--margin);opacity:.7}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.toolbar label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-soft);font-size:15px}
select{font:600 15px var(--body);color:var(--ink);background:var(--sheet);border:2px solid var(--line);border-radius:10px;padding:5px 8px}

.btn{font:600 17px var(--display);border:2px solid var(--ink);background:var(--sheet);color:var(--ink);
  border-radius:14px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.no{border-color:var(--bad);color:var(--bad);background:var(--sheet)}
.btn.small{font-size:15px;padding:6px 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hint{color:var(--ink-soft);font-size:15px;text-align:center;margin:8px 0 0}

/* flashcards */
.cardzone{perspective:1000px;display:flex;justify-content:center;margin:6px 0 18px}
.card{width:min(340px,100%);aspect-ratio:4/3.3;max-width:100%;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);border:none;background:none;padding:0;font:inherit;color:inherit}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:3px solid var(--ink);
  background:var(--sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--chip)}
.pic{font-size:78px;line-height:1}
.en{font-family:var(--display);font-weight:600;font-size:40px;direction:ltr}
.he{font-family:var(--display);font-weight:600;font-size:38px}
.tag{position:absolute;top:10px;inset-inline-start:14px;font-size:13px;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums}
.known-badge{position:absolute;top:10px;inset-inline-end:14px;font-size:13px;font-weight:700;color:var(--ok)}
.speak{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:99px;width:46px;height:46px;font-size:22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}

/* dictation */
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 16px;text-align:center}
.bigspeak{width:96px;height:96px;font-size:44px;border-radius:50%;border:3px solid var(--ink);background:var(--hl);color:var(--ink);cursor:pointer}
.answer{font:600 30px var(--display);direction:ltr;text-align:center;width:min(360px,100%);padding:10px 14px;
  border:none;border-bottom:3px solid var(--ink);background:transparent;color:var(--ink);letter-spacing:.06em}
.answer::placeholder{color:var(--line);letter-spacing:0}
.feedback{min-height:64px;text-align:center;margin-top:12px;font-family:var(--display);font-size:20px}
.feedback .good{color:var(--ok);font-weight:600}
.feedback .oops{color:var(--bad);font-weight:600}
.letters{direction:ltr;display:inline-flex;gap:3px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.letters span{min-width:28px;padding:2px 4px;border-radius:6px;font-size:26px;font-weight:600}
.letters .r{background:var(--ok-bg);color:var(--ok)}
.letters .w{background:var(--bad-bg);color:var(--bad);text-decoration:underline}
.meter{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.meter i{width:18px;height:8px;border-radius:4px;background:var(--chip)}
.meter i.ok{background:var(--ok)} .meter i.bad{background:var(--bad)} .meter i.now{background:var(--ink)}

/* quiz */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:480px;margin:0 auto}
.opt{font:600 22px var(--display);padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.opt.en-opt{direction:ltr}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

/* scramble */
.slots{direction:ltr;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:56px;margin:10px 0}
.slot{width:44px;height:52px;border-bottom:3px solid var(--ink);font:600 30px var(--display);display:flex;align-items:center;justify-content:center}
.tiles{direction:ltr;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:48px;height:52px;border-radius:12px;border:2px solid var(--ink);background:var(--hl);color:var(--ink);font:600 28px var(--display);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tile:disabled{visibility:hidden}

/* summary */
.summary{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.score{font:700 56px var(--display);font-variant-numeric:tabular-nums}
.stars{font-size:36px;letter-spacing:4px}
.misslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--chip);border-radius:99px;padding:4px 12px;font-weight:600}
.chip b{direction:ltr;unicode-bidi:isolate}

/* list */
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{padding:6px 8px;text-align:start;border-bottom:1px solid var(--rule)}
th{color:var(--ink-soft);font-size:14px;font-weight:700}
td.enc{direction:ltr;text-align:left;font-family:var(--display);font-weight:600;font-size:20px}
td.pc{font-size:26px;width:44px}
td.nc{color:var(--ink-soft);font-variant-numeric:tabular-nums;width:32px}
.hideen td.enc span{filter:blur(8px);user-select:none}
.tbl{overflow-x:auto}
.st{font-size:14px;font-weight:700}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.st.k{color:var(--ok)} .st.m{color:var(--bad)}

@media (max-width:480px){
  .page{padding:18px 36px 22px 12px}
  .page::before{right:20px}
  .pic{font-size:64px}.en{font-size:34px}.he{font-size:32px}
  .opt{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="he">
  <header>
    <div>
      <h1>מחברת <span class="mark">המילים</span> שלי</h1>
      <p class="sub">26 מילים באנגלית לכיתה ז׳ · כרטיסיות, הכתבה, חידון ומשחק אותיות</p>
    </div>
    <div class="progress" title="מילים שסימנת כ'יודעת'">
      <span>יודעת <span class="num" id="knownNum">0</span>/26</span>
      <div class="bar"><i id="knownBar" style="width:0"></i></div>
    </div>
  </header>

  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="cards" aria-selected="true">🃏 כרטיסיות</button>
    <button role="tab" data-tab="dict" aria-selected="false">✍️ הכתבה</button>
    <button role="tab" data-tab="quiz" aria-selected="false">❓ חידון</button>
    <button role="tab" data-tab="scr" aria-selected="false">🔤 סדרי אותיות</button>
    <button role="tab" data-tab="mist" aria-selected="false">🎯 מבחן הטעויות <span class="badge" id="mBadge" hidden></span></button>
    <button role="tab" data-tab="list" aria-selected="false">📋 רשימת מילים</button>
  </nav>

  <!-- FLASHCARDS -->
  <section class="page" id="tab-cards">
    <div class="toolbar">
      <label for="cDir">כיוון:
        <select id="cDir"><option value="en">אנגלית ← עברית</option><option value="he">עברית ← אנגלית</option></select>
      </label>
      <label for="cSet">מילים:
        <select id="cSet"><option value="all">כל המילים</option><option value="todo">רק מה שעוד לא יודעת</option></select>
      </label>
      <button class="btn small" id="cShuffle" type="button">🔀 ערבבי</button>
    </div>
    <div class="cardzone">
      <button class="card" id="card" type="button" aria-label="הפכי כרטיס">
        <div class="face front" id="cFront"></div>
        <div class="face back" id="cBack"></div>
      </button>
    </div>
    <div class="row">
      <button class="btn" id="cPrev" type="button">→ הקודם</button>
      <button class="btn no" id="cNo" type="button">עוד לא 🤔</button>
      <button class="btn ok" id="cYes" type="button">יודעת! ✓</button>
      <button class="btn" id="cNext" type="button">הבא ←</button>
    </div>
    <p class="hint">לחצי על הכרטיס כדי להפוך אותו · 🔊 משמיע את המילה באנגלית</p>
  </section>

  <!-- DICTATION -->
  <section class="page" id="tab-dict" hidden>
    <div id="dSetup">
      <div class="toolbar">
        <label for="dMode">איך לשאול:
          <select id="dMode">
            <option value="audio">לשמוע באנגלית 🔊</option>
            <option value="hebrew">לראות בעברית + תמונה</option>
          </select>
        </label>
        <label for="dCount">כמה מילים:
          <select id="dCount"><option value="10">10</option><option value="15">15</option><option value="26">כל ה־26</option></select>
        </label>
        <label for="dSet">מתוך:
          <select id="dSet"><option value="all">כל המילים</option><option value="todo">מה שעוד לא יודעת</option><option value="miss">מילים שטעיתי בהן</option></select>
        </label>
      </div>
      <div class="summary">
        <div class="pic">📝</div>
        <p style="margin:0;max-width:44ch">שומעים מילה, כותבים אותה באנגלית ובודקים. אם טעית, רואים בדיוק איזו אות.</p>
        <button class="btn primary" id="dStart" type="button">מתחילים הכתבה</button>
      </div>
    </div>
    <div id="dRun" hidden>
      <div class="meter" id="dMeter"></div>
      <div class="prompt" id="dPrompt"></div>
      <form id="dForm" class="row" style="flex-direction:column;align-items:center">
        <input id="dInput" class="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="כתבי כאן באנגלית" dir="ltr">
        <div class="row" style="margin-top:14px">
          <button class="btn primary" id="dCheck" type="submit">בדיקה ✓</button>
          <button class="btn small" id="dHint" type="button">💡 רמז</button>
        </div>
      </form>
      <div class="feedback" id="dFeed" aria-live="polite"></div>
    </div>
    <div id="dDone" hidden class="summary"></div>
  </section>

  <!-- QUIZ -->
  <section class="page" id="tab-quiz" hidden>
    <div id="qRun"></div>
  </section>

  <!-- SCRAMBLE -->
  <section class="page" id="tab-scr" hidden>
    <div id="sRun"></div>
  </section>

  <!-- MISTAKES TEST -->
  <section class="page" id="tab-mist" hidden>
    <div id="mHome"></div>
    <div id="mRun" hidden>
      <div class="meter" id="mMeter"></div>
      <div class="prompt" id="mPrompt"></div>
      <form id="mForm" class="row" style="flex-direction:column;align-items:center">
        <input id="mInput" class="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="כתבי כאן באנגלית" dir="ltr">
        <div class="row" style="margin-top:14px"><button class="btn primary" id="mCheck" type="submit">בדיקה ✓</button></div>
      </form>
      <div class="feedback" id="mFeed" aria-live="polite"></div>
    </div>
  </section>

  <!-- LIST -->
  <section class="page" id="tab-list" hidden>
    <div class="toolbar">
      <label for="lHide"><input type="checkbox" id="lHide"> הסתירי את האנגלית (להכתבה עם הורה)</label>
      <button class="btn small" id="lReset" type="button">איפוס התקדמות</button>
    </div>
    <div id="lConfirm" hidden class="row" style="margin-bottom:12px;justify-content:flex-start">
      <span>למחוק את כל הסימונים והטעויות?</span>
      <button class="btn small no" id="lResetYes" type="button">כן, לאפס</button>
      <button class="btn small" id="lResetNo" type="button">ביטול</button>
    </div>
    <div class="tbl"><table id="lTable"></table></div>
  </section>
</div>

<script>
const WORDS=[
 {en:"date",he:"תאריך",p:"📅"},{en:"vacation",he:"חופשה",p:"🏖️"},{en:"hobby",he:"תחביב",p:"🎨"},
 {en:"place",he:"מקום",p:"📍"},{en:"listen",he:"להקשיב",p:"🎧"},{en:"summer",he:"קיץ",p:"☀️"},
 {en:"help",he:"לעזור",p:"🤝"},{en:"visit",he:"לבקר",p:"🏡"},{en:"sentence",he:"משפט",p:"📝"},
 {en:"friend",he:"חבר / חברה",p:"👭"},{en:"student",he:"תלמיד / תלמידה",p:"🧑‍🎓"},{en:"easy",he:"קל",p:"😊"},
 {en:"hard",he:"קשה",p:"🤔"},{en:"learn",he:"ללמוד",p:"💡"},{en:"read",he:"לקרוא",p:"📖"},
 {en:"write",he:"לכתוב",p:"✍️"},{en:"speak",he:"לדבר",p:"🗣️"},{en:"day",he:"יום",p:"🌤️"},
 {en:"open",he:"לפתוח",p:"🔓"},{en:"close",he:"לסגור",p:"🔒"},{en:"sit",he:"לשבת",p:"🪑"},
 {en:"stand",he:"לעמוד",p:"🧍‍♀️"},{en:"sleep",he:"לישון",p:"😴"},{en:"book",he:"ספר",p:"📕"},
 {en:"notebook",he:"מחברת",p:"📓"},{en:"period",he:"נקודה ( . )",p:"⚫"}
].map((w,i)=>({...w,id:i}));

// ---------- state (per-browser, optional) ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get("vk_known",[]));
let misses=store.get("vk_miss",{}); // id -> count
function save(){store.set("vk_known",[...known]);store.set("vk_miss",misses);renderProgress();renderList();renderBadge()}
function renderBadge(){const n=Object.keys(misses).length,b=document.getElementById("mBadge");if(b){b.hidden=!n;b.textContent=n}}
function markKnown(id,yes){yes?known.add(id):known.delete(id);save()}
function addMiss(id){misses[id]=(misses[id]||0)+1;save()}
function renderProgress(){document.getElementById("knownNum").textContent=known.size;
  document.getElementById("knownBar").style.width=(known.size/26*100)+"%"}

const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pool(kind){
  if(kind==="todo"){const r=WORDS.filter(w=>!known.has(w.id));return r.length?r:WORDS}
  if(kind==="miss"){const r=WORDS.filter(w=>misses[w.id]);return r.length?r:WORDS}
  return WORDS;

const players={};
function player(w){if(!players[w]&&AUDIO[w]){const a=new Audio("data:audio/mpeg;base64,"+AUDIO[w]);a.preload="auto";players[w]=a}return players[w]}
let current=null;
const canSpeak=()=>true;
function say(text,rate){
  const a=player(text);
  if(a){try{if(current&&current!==a){current.pause()}current=a;a.pause();a.currentTime=0;
    a.preservesPitch=true;a.playbackRate=rate&&rate<0.7?0.65:1;const p=a.play();if(p&&p.catch)p.catch(()=>fallback(text,rate))}catch(e){fallback(text,rate)}return}
  fallback(text,rate);
}
function fallback(text,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||0.8;speechSynthesis.speak(u)}catch(e){}}

// ---------- tabs ----------
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("section.page").forEach(s=>s.hidden=s.id!=="tab-"+b.dataset.tab);
  if(b.dataset.tab==="quiz"&&!quiz)startQuiz();
  if(b.dataset.tab==="scr"&&!scr)startScr();
  if(b.dataset.tab==="mist"&&!(mt&&!$("mRun").hidden))renderMistHome();
  try{if(current)current.pause()}catch(e){}
});

// ---------- flashcards ----------
let deck=[...WORDS],ci=0;
function buildDeck(){deck=pool($("cSet").value);ci=0;renderCard()}
function renderCard(){
  const w=deck[ci],enFirst=$("cDir").value==="en";
  $("card").classList.remove("flip");
  const enSide=`<span class="pic">${w.p}</span><span class="en">${esc(w.en)}</span>`;
  const heSide=`<span class="pic">${w.p}</span><span class="he">${esc(w.he)}</span>`;
  const top=`<span class="tag">${ci+1} / ${deck.length}</span>${known.has(w.id)?'<span class="known-badge">✓ יודעת</span>':""}`;
  const spk=`<span class="speak" role="button" tabindex="0" data-say="${esc(w.en)}" aria-label="השמעה">🔊</span>`;
  $("cFront").innerHTML=top+(enFirst?enSide+spk:heSide);
  $("cBack").innerHTML=top+(enFirst?heSide:enSide+spk);
}
$("card").addEventListener("click",e=>{const s=e.target.closest("[data-say]");
  if(s){e.stopPropagation();say(s.dataset.say);return}
  $("card").classList.toggle("flip");
  if($("card").classList.contains("flip")&&$("cDir").value==="he")say(deck[ci].en);
});
$("card").addEventListener("keydown",e=>{const s=e.target.closest("[data-say]");if(s&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();say(s.dataset.say)}});
const step=d=>{ci=(ci+d+deck.length)%deck.length;renderCard()};
$("cNext").onclick=()=>step(1);$("cPrev").onclick=()=>step(-1);
$("cYes").onclick=()=>{markKnown(deck[ci].id,true);step(1)};
$("cNo").onclick=()=>{markKnown(deck[ci].id,false);step(1)};
$("cShuffle").onclick=()=>{deck=shuffle(deck);ci=0;renderCard()};
$("cDir").onchange=renderCard;$("cSet").onchange=buildDeck;

// ---------- dictation ----------
let dict=null;
function meter(el,st){el.innerHTML=st.items.map((_,i)=>`<i class="${st.res[i]===true?"ok":st.res[i]===false?"bad":i===st.i?"now":""}"></i>`).join("")}
$("dStart").onclick=()=>{
  const n=+$("dCount").value;const items=shuffle(pool($("dSet").value)).slice(0,n);
  dict={items,i:0,res:[],tries:0,mode:$("dMode").value,wrong:[]};
  $("dSetup").hidden=true;$("dDone").hidden=true;$("dRun").hidden=false;showDict();
};
function showDict(){
  const w=dict.items[dict.i];dict.tries=0;dict.hint=false;
  meter($("dMeter"),dict);
  const audio=dict.mode==="audio"&&canSpeak();
  $("dPrompt").innerHTML=(audio
    ?`<button class="bigspeak" type="button" id="dPlay" aria-label="השמעה">🔊</button><div class="row"><button class="btn small" type="button" id="dSlow">🐢 לאט</button></div><div id="dHe" class="hint" hidden><span class="pic" style="font-size:40px">${w.p}</span> ${esc(w.he)}</div>`
    :`<span class="pic">${w.p}</span><span class="he">${esc(w.he)}</span>`)
    +`<span class="hint">מילה ${dict.i+1} מתוך ${dict.items.length}</span>`;
  if(audio){$("dPlay").onclick=()=>{say(w.en);$("dInput").focus()};$("dSlow").onclick=()=>{say(w.en,0.5);$("dInput").focus()};setTimeout(()=>say(w.en),250)}
  $("dInput").value="";$("dInput").disabled=false;$("dFeed").innerHTML="";$("dCheck").textContent="בדיקה ✓";$("dHint").hidden=false;
  $("dInput").focus();
}
function diffHTML(ans,correct){
  let out="";for(let i=0;i<correct.length;i++){out+=`<span class="${ans[i]===correct[i]?"r":"w"}">${esc(correct[i])}</span>`}
  return `<div class="letters">${out}</div>`;
}
$("dHint").onclick=()=>{const w=dict.items[dict.i];
  const he=$("dHe");if(he&&he.hidden){he.hidden=false;return}
  dict.hint=true;$("dFeed").innerHTML=`<span class="hint">מתחילה ב־<b dir="ltr">${esc(w.en[0])}</b> · ${w.en.length} אותיות</span>`;$("dInput").focus()};
$("dForm").addEventListener("submit",e=>{e.preventDefault();
  if(!dict)return;
  if($("dInput").disabled){next();return}
  const w=dict.items[dict.i],ans=$("dInput").value.trim().toLowerCase();
  if(!ans){$("dInput").focus();return}
  if(ans===w.en){
    if(dict.res[dict.i]===undefined)dict.res[dict.i]=true;
    $("dFeed").innerHTML=`<div class="good">${pick(["מעולה! 🎉","בדיוק! ⭐","כל הכבוד! 👏","צדקת! 💪"])}</div>${diffHTML(w.en,w.en)}`;
    lock();
  }else{
    dict.tries++;
    if(dict.tries<2){$("dFeed").innerHTML=`<div class="oops">כמעט… נסי עוד פעם 🙂</div><div class="hint">מספר אותיות: ${w.en.length}</div>`;$("dInput").select()}
    else{dict.res[dict.i]=false;dict.wrong.push(w);addMiss(w.id);
      $("dFeed").innerHTML=`<div class="oops">כתבת: <span dir="ltr">${esc(ans)}</span> · התשובה:</div>${diffHTML(ans,w.en)}`;say(w.en);lock()}
  }
  meter($("dMeter"),dict);
});
function lock(){$("dInput").disabled=true;$("dHint").hidden=true;$("dCheck").textContent=dict.i+1<dict.items.length?"למילה הבאה ←":"לסיכום ←";$("dCheck").focus()}
function next(){dict.i++;if(dict.i<dict.items.length)showDict();else finishDict()}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function stars(p){return p>=0.9?"⭐⭐⭐":p>=0.6?"⭐⭐☆":p>0?"⭐☆☆":"☆☆☆"}
function finishDict(){
  const ok=dict.res.filter(x=>x===true).length,n=dict.items.length;
  dict.items.forEach((w,i)=>{if(dict.res[i]===true&&!misses[w.id])known.add(w.id)});save();
  $("dRun").hidden=true;const d=$("dDone");d.hidden=false;
  d.innerHTML=`<div class="stars">${stars(ok/n)}</div><div class="score">${ok}/${n}</div>
   <p style="margin:0">${ok===n?"הכתבה מושלמת! 🏆":ok/n>=0.7?"עבודה יפה מאוד!":"ממשיכים לתרגל, זה משתפר כל פעם."}</p>
   ${dict.wrong.length?`<div><div class="hint" style="margin-bottom:6px">מילים לחזור עליהן:</div><div class="misslist">${dict.wrong.map(w=>`<span class="chip"><b>${esc(w.en)}</b> · ${esc(w.he)}</span>`).join("")}</div></div>`:""}
   <div class="row">${dict.wrong.length?`<button class="btn primary" id="dRetry" type="button">תרגול חוזר רק על הטעויות</button>`:""}
   <button class="btn" id="dAgain" type="button">הכתבה חדשה</button></div>`;
  if(dict.wrong.length)$("dRetry").onclick=()=>{dict={items:shuffle(dict.wrong),i:0,res:[],tries:0,mode:dict.mode,wrong:[]};d.hidden=true;$("dRun").hidden=false;showDict()};
  $("dAgain").onclick=()=>{d.hidden=true;$("dSetup").hidden=false};
}

// ---------- quiz ----------
let quiz=null;
function startQuiz(){const items=shuffle(WORDS).slice(0,10);
  quiz={items,i:0,res:[],dirs:items.map(()=>Math.random()<.5?"en":"he")};showQ()}
function showQ(){
  const w=quiz.items[quiz.i],dir=quiz.dirs[quiz.i];
  const opts=shuffle([w,...shuffle(WORDS.filter(x=>x.id!==w.id)).slice(0,3)]);
  $("qRun").innerHTML=`<div class="meter" id="qMeter"></div>
   <div class="prompt">${dir==="en"
     ?`<span class="en">${esc(w.en)}</span><button class="speak" type="button" id="qSay" aria-label="השמעה">🔊</button><span class="hint">מה הפירוש בעברית?</span>`
     :`<span class="pic">${w.p}</span><span class="he">${esc(w.he)}</span><span class="hint">איך אומרים באנגלית?</span>`}</div>
   <div class="opts">${opts.map(o=>`<button class="opt ${dir==="he"?"en-opt":""}" type="button" data-id="${o.id}">${esc(dir==="en"?o.he:o.en)}</button>`).join("")}</div>
   <div class="feedback" id="qFeed" aria-live="polite"></div>`;
  meter($("qMeter"),quiz);
  if($("qSay"))$("qSay").onclick=()=>say(w.en);
  $("qRun").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const right=+b.dataset.id===w.id;quiz.res[quiz.i]=right;if(!right)addMiss(w.id);
    $("qRun").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.id===w.id)x.classList.add("right")});
    if(!right)b.classList.add("wrong");say(w.en);
    $("qFeed").innerHTML=`<div class="${right?"good":"oops"}">${right?pick(["נכון! 🎉","יפה! ⭐","בול! 👏"]):`התשובה: <span dir="ltr">${esc(w.en)}</span> = ${esc(w.he)}`}</div>
      <div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="qNext">${quiz.i+1<quiz.items.length?"הבאה ←":"לסיכום ←"}</button></div>`;
    meter($("qMeter"),quiz);$("qNext").focus();
    $("qNext").onclick=()=>{quiz.i++;quiz.i<quiz.items.length?showQ():endQ()};
  });
}
function endQ(){const ok=quiz.res.filter(Boolean).length;
  $("qRun").innerHTML=`<div class="summary"><div class="stars">${stars(ok/10)}</div><div class="score">${ok}/10</div>
   <p style="margin:0">${ok===10?"מושלם! 🏆":ok>=7?"יופי של חידון!":"עוד סבב אחד ואת שם."}</p>
   <button class="btn primary" type="button" id="qAgain">חידון חדש</button></div>`;
  $("qAgain").onclick=startQuiz}

// ---------- scramble ----------
let scr=null;
function startScr(){scr={items:shuffle(WORDS.filter(w=>w.en.length>2)).slice(0,8),i:0,res:[]};showS()}
function showS(){
  const w=scr.items[scr.i];let letters=shuffle(w.en.split(""));
  if(letters.join("")===w.en&&w.en.length>1)letters=letters.reverse();
  scr.built=[];scr.used=[];scr.wrongOnce=false;
  $("sRun").innerHTML=`<div class="meter" id="sMeter"></div>
   <div class="prompt"><span class="pic">${w.p}</span><span class="he">${esc(w.he)}</span><span class="hint">לחצי על האותיות לפי הסדר הנכון</span></div>
   <div class="slots" id="sSlots">${w.en.split("").map(()=>`<span class="slot"></span>`).join("")}</div>
   <div class="tiles" id="sTiles">${letters.map((l,i)=>`<button class="tile" type="button" data-i="${i}">${esc(l)}</button>`).join("")}</div>
   <div class="row" style="margin-top:14px"><button class="btn small" type="button" id="sBack">⌫ מחיקה</button><button class="btn small" type="button" id="sSay">🔊 השמעה</button></div>
   <div class="feedback" id="sFeed" aria-live="polite"></div>`;
  meter($("sMeter"),scr);
  $("sSay").onclick=()=>say(w.en);
  const tiles=[...$("sTiles").children],slots=[...$("sSlots").children];
  const paint=()=>{slots.forEach((s,i)=>s.textContent=scr.built[i]||"")};
  tiles.forEach(t=>t.onclick=()=>{scr.built.push(t.textContent);scr.used.push(t);t.disabled=true;paint();
    if(scr.built.length===w.en.length){
      if(scr.built.join("")===w.en){if(scr.res[scr.i]===undefined)scr.res[scr.i]=true;say(w.en);
        $("sFeed").innerHTML=`<div class="good">${pick(["מעולה! 🎉","בדיוק! ⭐","כל הכבוד! 👏"])}</div><div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="sNext">${scr.i+1<scr.items.length?"הבאה ←":"לסיכום ←"}</button></div>`;
        $("sBack").disabled=true;meter($("sMeter"),scr);$("sNext").focus();
        $("sNext").onclick=()=>{scr.i++;scr.i<scr.items.length?showS():endS()};
      }else{if(scr.res[scr.i]===undefined)addMiss(w.id);scr.res[scr.i]=false;$("sFeed").innerHTML=`<div class="oops">לא בדיוק, נסי לסדר מחדש 🙂</div>`;
        setTimeout(()=>{scr.used.forEach(t=>t.disabled=false);scr.built=[];scr.used=[];paint();$("sFeed").innerHTML=""},900)}
    }});
  $("sBack").onclick=()=>{const t=scr.used.pop();if(t){t.disabled=false;scr.built.pop();paint()}};
}
function endS(){const ok=scr.res.filter(Boolean).length,n=scr.items.length;
  $("sRun").innerHTML=`<div class="summary"><div class="stars">${stars(ok/n)}</div><div class="score">${ok}/${n}</div>
   <p style="margin:0">${ok===n?"סידרת הכל בניסיון הראשון! 🏆":"יפה מאוד!"}</p>
   <button class="btn primary" type="button" id="sAgain">עוד סבב</button></div>`;
  $("sAgain").onclick=startScr}

// ---------- mistakes test ----------
// every wrong answer anywhere (dictation, quiz, letters) lands in `misses`;
// here each such word is asked again; a correct answer removes it from the list.
let mt=null;
function mistWords(){return WORDS.filter(w=>misses[w.id]).sort((a,b)=>misses[b.id]-misses[a.id])}
function renderMistHome(){
  const list=mistWords();$("mRun").hidden=true;const h=$("mHome");h.hidden=false;
  if(!list.length){h.innerHTML=`<div class="summary"><div class="pic">🏆</div><div class="he" style="font-size:28px">אין טעויות פתוחות!</div>
    <p style="margin:0;max-width:46ch">כל מילה שתטעי בה בהכתבה, בחידון או בסידור אותיות תיכנס לכאן אוטומטית, והמבחן ייבנה רק ממנה.</p></div>`;return}
  h.innerHTML=`<div class="summary"><div class="pic">🎯</div>
    <div class="he" style="font-size:28px">${list.length} מילים לחיזוק</div>
    <p style="margin:0;max-width:46ch">המבחן בנוי רק מהמילים שטעית בהן. תשובה נכונה מוציאה את המילה מהרשימה, טעות משאירה אותה.</p>
    <div class="misslist">${list.map(w=>`<span class="chip"><b>${esc(w.en)}</b> · ${esc(w.he)} <span class="st m">×${misses[w.id]}</span></span>`).join("")}</div>
    <button class="btn primary" id="mStart" type="button">התחילי מבחן טעויות</button></div>`;
  $("mStart").onclick=startMist;
}
function startMist(){mt={items:shuffle(mistWords()),i:0,res:[],fixed:[],still:[]};$("mHome").hidden=true;$("mRun").hidden=false;showMist()}
function showMist(){
  const w=mt.items[mt.i];meter($("mMeter"),mt);
  $("mPrompt").innerHTML=`<span class="pic">${w.p}</span><span class="he">${esc(w.he)}</span>
    <button class="speak" type="button" id="mSay" aria-label="השמעה">🔊</button>
    <span class="hint">מילה ${mt.i+1} מתוך ${mt.items.length} · טעית בה ${misses[w.id]} פעמים</span>`;
  $("mSay").onclick=()=>{say(w.en);$("mInput").focus()};
  $("mInput").value="";$("mInput").disabled=false;$("mFeed").innerHTML="";$("mCheck").textContent="בדיקה ✓";$("mInput").focus();
}
$("mForm").addEventListener("submit",e=>{e.preventDefault();if(!mt)return;
  if($("mInput").disabled){mt.i++;mt.i<mt.items.length?showMist():endMist();return}
  const w=mt.items[mt.i],ans=$("mInput").value.trim().toLowerCase();if(!ans)return;
  if(ans===w.en){mt.res[mt.i]=true;mt.fixed.push(w);delete misses[w.id];save();
    $("mFeed").innerHTML=`<div class="good">תוקן! המילה יצאה מהרשימה ✨</div>${diffHTML(w.en,w.en)}`;}
  else{mt.res[mt.i]=false;mt.still.push(w);addMiss(w.id);
    $("mFeed").innerHTML=`<div class="oops">כתבת: <span dir="ltr">${esc(ans)}</span> · התשובה:</div>${diffHTML(ans,w.en)}`;}
  say(w.en);$("mInput").disabled=true;$("mCheck").textContent=mt.i+1<mt.items.length?"למילה הבאה ←":"לסיכום ←";meter($("mMeter"),mt);$("mCheck").focus();
});
function endMist(){const ok=mt.fixed.length,n=mt.items.length;$("mRun").hidden=true;const h=$("mHome");h.hidden=false;
  h.innerHTML=`<div class="summary"><div class="stars">${stars(ok/n)}</div><div class="score">${ok}/${n}</div>
   <p style="margin:0">${ok===n?"תיקנת את כל הטעויות! 🏆":`תיקנת ${ok} מילים. נשארו ${mt.still.length} לחיזוק.`}</p>
   ${mt.still.length?`<div class="misslist">${mt.still.map(w=>`<span class="chip"><b>${esc(w.en)}</b> · ${esc(w.he)}</span>`).join("")}</div>`:""}
   <div class="row">${mt.still.length?`<button class="btn primary" type="button" id="mAgain">עוד סבב על מה שנשאר</button>`:""}<button class="btn" type="button" id="mBack">חזרה</button></div></div>`;
  if(mt.still.length)$("mAgain").onclick=startMist;$("mBack").onclick=renderMistHome;}

// ---------- list ----------
function renderList(){
  $("lTable").innerHTML=`<thead><tr><th>#</th><th></th><th>English</th><th>עברית</th><th></th><th>מצב</th></tr></thead><tbody>`+
   WORDS.map(w=>`<tr><td class="nc">${w.id+1}</td><td class="pc">${w.p}</td><td class="enc"><span>${esc(w.en)}</span></td><td>${esc(w.he)}</td>
    <td><button class="speak" style="width:36px;height:36px;font-size:17px" type="button" data-say="${esc(w.en)}" aria-label="השמעה">🔊</button></td>
    <td>${known.has(w.id)?'<span class="st k">✓ יודעת</span>':misses[w.id]?`<span class="st m">טעויות: ${misses[w.id]}</span>`:""}</td></tr>`).join("")+`</tbody>`;
}
$("lTable").addEventListener("click",e=>{const s=e.target.closest("[data-say]");if(s)say(s.dataset.say)});
$("lHide").onchange=e=>$("lTable").classList.toggle("hideen",e.target.checked);
$("lReset").onclick=()=>$("lConfirm").hidden=false;
$("lResetNo").onclick=()=>$("lConfirm").hidden=true;
$("lResetYes").onclick=()=>{known=new Set();misses={};save();$("lConfirm").hidden=true;renderCard()};

renderProgress();renderCard();renderList();renderBadge();
</script>
</body>
